---
# Versión fijada de k3s (reproducibilidad)
k3s_version: v1.36.5+k3s1

# Argumentos del servidor k3s
k3s_server_args:
  - --disable=traefik
  - --tls-san={{ ansible_host }}

# Ruta del kubeconfig en el equipo de administración (fuera del repositorio)
k3s_kubeconfig_local: "{{ lookup('env', 'HOME') }}/.kube/tfg-onprem.yaml"

# Reglas de firewall para k3s (documentación oficial de k3s para Debian/UFW)
k3s_firewall_rules:
  - { port: "6443", proto: tcp, comment: "k3s: API de Kubernetes" }
  - { src: "10.42.0.0/16", comment: "k3s: red de pods" }
  - { src: "10.43.0.0/16", comment: "k3s: red de servicios" }
  - { port: "80", proto: tcp, comment: "Ingress: HTTP (Traefik)" }
  - { port: "443", proto: tcp, comment: "Ingress: HTTPS (Traefik)" }
