---
- name: Abrir en el firewall los puertos y redes de k3s
  community.general.ufw:
    rule: allow
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    from_ip: "{{ item.src | default('any') }}"
    comment: "{{ item.comment }}"
  loop: "{{ k3s_firewall_rules }}"
  when: hardening_firewall_enabled | default(true)

- name: Comprobar la versión de k3s instalada
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Descargar el instalador oficial de k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Instalar k3s (servidor)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "server {{ k3s_server_args | join(' ') }}"
  when: k3s_version not in (k3s_installed.stdout | default(''))

- name: Esperar a que el nodo esté Ready
  ansible.builtin.command: >
    k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=180s
  changed_when: false



- name: Leer el kubeconfig del nodo
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_remote
  run_once: true

- name: Escribir el kubeconfig en el equipo de administración (con la IP del nodo)
  ansible.builtin.copy:
    content: >-
      {{ k3s_kubeconfig_remote.content | b64decode
         | regex_replace('https://127\.0\.0\.1:6443', 'https://' ~ ansible_host ~ ':6443') }}
    dest: "{{ k3s_kubeconfig_local }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
