---
- name: Actualizar la caché de paquetes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false  # refrescar la caché de apt no cambia la configuración del sistema

- name: Instalar paquetes base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Configurar la zona horaria
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Activar las actualizaciones automáticas de seguridad
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Agente QEMU (solo VMs de Proxmox)
  when: common_qemu_guest_agent | bool
  block:
    - name: Instalar el agente QEMU
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Arrancar el agente QEMU
      ansible.builtin.systemd_service:
        name: qemu-guest-agent
        state: started
