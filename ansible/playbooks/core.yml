---
# Servicios core: bastión SSH Warpgate (único punto de entrada SSH humano a las VMs)
- name: Servicios core (bastión Warpgate)
  hosts: core
  become: true
  roles:
    - warpgate

# Autoriza la clave cliente de Warpgate en el resto de VMs. La clave privada no
# sale nunca de core-01; si core-01 se recrea, la línea marcada se sustituye.
- name: Autorizar el bastión Warpgate en las demás VMs
  hosts: all:!core
  become: true
  vars:
    warpgate_host: "{{ groups['core'] | first }}"
    warpgate_client_key: >-
      {{ (hostvars[warpgate_host].warpgate_client_keys.stdout_lines
          | select('match', '^ssh-ed25519 ') | first).split()[:2] | join(' ') }}
  tasks:
    - name: Añadir la clave cliente de Warpgate a authorized_keys
      ansible.builtin.lineinfile:
        path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
        regexp: " warpgate@{{ warpgate_host }}$"
        line: "{{ warpgate_client_key }} warpgate@{{ warpgate_host }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Leer la clave de host SSH (para registrarla como conocida en Warpgate)
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      register: warpgate_target_host_key

# Configura roles, destinos, huellas y usuarios con la API de Warpgate.
# Se omite en modo --check: las llamadas a una API no se pueden simular.
- name: Configurar Warpgate por su API
  hosts: core
  gather_facts: false
  tasks:
    - name: Aplicar la configuración declarativa (group_vars/core.yml)
      ansible.builtin.include_role:
        name: warpgate
        tasks_from: api
      when: not ansible_check_mode
